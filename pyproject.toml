[project]
name = "liquidity-system"
version = "0.1.0"
description = "Система автоматизированного формирования отчётности по структурной ликвидности"
requires-python = ">=3.10"
dependencies = [
    # БД
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Данные
    "pandas>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    # Конфигурация
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    # Логирование
    "structlog>=24.0",
    # CLI
    "click>=8.1",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Отчёты
    "reportlab>=4.1",
    "jinja2>=3.1",
]

[project.scripts]
etl       = "liquidity.etl.pipeline:cli"
calculate = "liquidity.core.pipeline:cli"
report    = "liquidity.reports.generator:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liquidity"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
