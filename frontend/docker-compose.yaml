services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: liquidity_frontend_dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - core_liquidity_net

networks:
  core_liquidity_net:
    external: true
    name: core_liquidity_net
